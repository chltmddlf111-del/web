<!DOCTYPE html>
<html lang="ko">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>순서가 없는 목록</title>
   
   <style>
ul{
   list-style: decimal;
}
ol{
   list-style: disc;
}

   </style>
</head>
<body>
   <ul>
      <li>골든키위</li>
      <li>아오리</li>
      <li>수박</li>
      <li>멜론</li>
   </ul>
   <ol>
      <li>골든키위</li>
      <li>아오리</li>
      <li>수박</li>
      <li>멜론</li>
   </ol>
</body>
</html>
