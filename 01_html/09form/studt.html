<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스터디 2</title>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    figure {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #container {
      position: absolute;
      left: 100px;
      top: 100px;
      color: #fff;
    }

    #container2 {
      position: absolute;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      top: 50px;
    }
  </style>
  <link rel="stylesheet" href="css/form04.css">
</head>

<body>
  <figure>
    <video src="../08audio_vidio/media/flower.mp4" id="bg" autoplay muted loop playsinline
      poster="../06img/02.jpg"></video>
  </figure>
  <div id="container">
    <h2>FLower of Legend</h2>
  </div>
  <main>
    <section id="container2">
      <form>
        <fieldset>
          <fieldset>

            <legend>Flower.kr</legend>
            <div>
              <label for="uid">아이디</label>
              <input type="text" id="uid" required maxlength="12" minlength="6" pattern="[a-zA-Z0-9]{6,12}"
                title="영어와 숫자로 6~12자 작성해주세요.">
            </div>
            <div>
              <label for="pw">비밀번호</label>
              <input type="password" id="pw" required minlength="8" maxlength="64" pattern="(?=.*[^a-zA-Z0-9]).{8,64}"
                title="비밀번호는 8~64자이며 특수문자를 1개 이상 포함해야 합니다">
            </div>
            <div>
              <label for="uid">이메일</label>
              <input type="email" id="mail" title="이메일 형식 작성 부탁드립니다">
            </div>

            <button type="submit">로그인</button>

            </ul>
          </fieldset>
          <fieldset>
            <p><small><a href="Sign_up.html">아직 회원이 아니신가요?</a></small></p>
          </fieldset>
          <fieldset>
            <input type="image" src="./btn.png">
            <input type="image" src="./kakao.png">

          </fieldset>
        </fieldset>
      </form>
    </section>





  </main>
</body>

</html>
