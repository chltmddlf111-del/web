<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>input 태그 속성</title>
   <style>
      em {
         color: red;
      }
   </style>
</head>

<body>
   <form>
      <ul>
         <li>
            <label for="name">이름</label>
            <input type="text" id="name" autofocus>
            <!-- autofocus : 페이지를 불러오자마자 원하는 폼 요소에 마우스 커서 표시-->
         </li>
         <li>
            <label for="st">학번</label>
            <input type="number" id="st" placeholder="하이픈 없이 입력">
            <!-- placeholder : 입력란에 표시하는 힌트로 필드를 클릭하면 사라짐 -->
         </li>
         <li>
            <label for="rd">읽기만함</label>
            <input type="text" id="rd" value="못쳐요" readonly>
            <!-- autofocus : 페이지를 불러오자마자 원하는 폼 요소에 마우스 커서 표시-->
         </li>
         <li>
            <label for="nic"><em>*</em>닉네임</label>
            <input type="text" id="nic" required>
            <!-- required : 필수 필드 체크 -->
         </li>
         <li>
            <label for="p"></label>
            <input type="submit" value="전송">
         </li>
      </ul>
   </form>
</body>

</html>
