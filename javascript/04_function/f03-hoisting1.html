<!DOCTYPE html>
<html lang="ko">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>함수 선언 방식 3종 - 선언문</title>
</head>
<body>
   <script>
      printMsg('함수 선언 전 호출');//const나 let으로 등록 후 사용 가능 // prinMsg(text1);

      function printMsg(msg) {
         document.write('함수 호출 메세지 :'  + msg + '<br>' );
      }

      printMsg('함수 선언 후 호출')
      printMsg('불러보자')

   </script>
</body>
</html>
