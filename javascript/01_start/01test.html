<!DOCTYPE html>
<html lang="ko">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>첫 자바스크립트</title>
</head>
<body>
   <button type="button" onclick="alert('자는중 건들지마셈.')">클릭하면 경고창</button>
   <button type="button" class="change_btn">글씨바꾸기</button>
   <button type="button" class="reset_btn">전체바꿈</button>
   <button type="button" id="out">외부스크립트</button>
   <p class="change">어디있게</p>
   <script>
      // crtl+/ 한줄 주석
      /*
      alt shift a 
      여러줄 주석
      */
     document.querySelector('.change_btn').onclick = () => {
      // onclick 의 속성을 바꾼다.
      document.querySelector('.change').innerHTML = '<em>일단 여기에는 없어!</em>'
      // 클릭하면 .change를 '<em>일단 여기에는 없어!</em>'로 바꾼다.
     }
   </script>
   <script>
      document.querySelector('.reset_btn').onclick = function(){
   // document.querySelector('.change_btn').onclick = () => 랑 같은 함수.
         document.write('<h1>크왕 여깄다</h1>')
         // 전체 글 바꿈
      }
   </script>
   <script src="js/01test.js"></script>
</body>
</html>
