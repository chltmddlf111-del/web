<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>생성자 함수(NEW)를 이용하는 방법 Object()와 this의 활용</title>
   <style>

   </style>
</head>

<body>
   <p id="toolname"></p>
   <p id="tooldomain"></p>
   <p id="toolupdata"></p>

   <script>
      //Object 생성
      let desighTool = new Object(); // 빈 객체 생성
      // 속성 정의
      desighTool.name = 'Figma';
      desighTool.domain = 'UI/UX/AX 디자인';
      desighTool.version = '126.5.6';
      // 126.12.8

      // 메서드 정의(this 활용);
      desighTool.introduce = function () {
         return `저는 ${this.domain}을 위한 ${this.name}툴이에요`
      }
      desighTool.updata = function (newVersion) {
         this.version = newVersion;
         return `${this.name} 버전이 ${this.version}으로 업데이트 되었습니다.`
      }
      //DOM 출력
      document.getElementById('toolname').textContent = desighTool.introduce();
      document.getElementById('tooldomain').innerHTML = `사용 분야 : <b>${desighTool.domain}</b>`;
      document.getElementById('toolupdata').textContent = desighTool.updata('90');
   </script>
</body>

</html>
