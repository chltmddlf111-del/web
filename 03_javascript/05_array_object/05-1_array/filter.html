<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>filter</title>
</head>

<body>
   <script>
      // 배열에서 조건이 참인 데이터만 걸러내 새로운 배열 생성
      // 나이 데이터
      let ages = [13, 25, 19, 32, 15, 40, 18, 22];

      //1)성인만 필터(18세 이상)
      function isAudult(age){
         return age>= 18 ;
      }
      let audult= ages.filter(isAudult);
      let thirtyD = ages.filter(v => v<30)
      document.write(`원본 배열 : ${ages.join('-')}<br>`)
      document.write(`성인만 필터 배열 : ${audult.join('-')}<br>`)
      document.write(`30세 미만 필터 배열 : ${thirtyD.join('-')}<br>`)
   </script>
</body>

</html>
