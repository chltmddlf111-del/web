<!DOCTYPE html>
<html lang="ko">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>if else 문</title>
</head>
<body>
   <script>
      /*
      prompt로 숫자를 두개를 받아와서 - num_0 , num_1
      첫번째 숫자가 두번째 숫자보다 클때
      "첫번째 숫자가 크군요"
      아닐때에
      "첫번째 숫자가 두번째 숫자보다 작거나 같군요"
      document.write()로 출력

      result-변수 출력
      */
      let num_0 = Number(prompt('숫자를 1부터 1000까지 입력하세요.','1'));
      let num_1 = Number(prompt('숫자를 1부터 1000까지 입력하세요.','1'));
      let result;
      if(num_0>num_1){
         result = '첫번째 숫자가 크군요';
      }else{
         result = '첫번째 숫자가 두번째 숫자보다 작거나 같군요';
      }

      document.write(result);
      
   </script>
</body>
</html>
