<!DOCTYPE html>
<html lang="ko">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>1~1000사이의 합</title>
</head>
<body>
   <script>
      //1~500사이에 6과 4의 배수만 찍기
      let x = 1; 
      while(x<=500){
         if(x%6 === 0 && x%4 === 0) {
            document.write(`<p>${x}</p>`)
         }
         x++
      }

      let i = 1;
      let sum = 0;
      while(1){
         sum+= i;
         i++
         if(i == 1001) break;
      }
      document.write('<h1>' + sum + '</h1>');

      let y = 1;
      let sum_1 = 0;
      while(y<=1000){
         if(y%7 == 0 && y&4 == 0){
            document.write(y)
         }
         y++
      }
   </script>
</body>
</html>
