<!DOCTYPE html>
<html lang="ko">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>background-iamges</title>
   <style>
      body{
         background-image: url(./img/bg1.png);
         background-repeat: repeat;/* 기본값 */
         background-repeat: repeat-x;/* x축으로 반복 */
         background-repeat: repeat-y;/* y축으로 반복 */;
         background-repeat: no-repeat;/* 반복 X */
      }
      .rp{
         width: 500px;
         height: 500px;
         border: 10px solid red;
         background-image: url(./img/bg8.png);
         background-size: 250px;
         background-repeat: space;
         /* 이미지가 잘리지 않도록 남은 공간을 이미지 사이즈 간격으로 분배 */
         background-repeat: round;
         /* 이미지가 영역에 딱맞게 반복되도록 이미지 크기를 자동 조정합니다. */
         /* 현재 위 아래 500px 이기때문에 250*250사이즈로 4개로 분배됩니다. */
      }
   </style>
</head>
<body>
   <div class="rp"></div>
</body>
</html>
