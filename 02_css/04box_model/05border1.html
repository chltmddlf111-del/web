<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>border</title>
   <style>
      div {
         width: 200px;
         height: 100px;
         margin: 15px;
         display: inline-block;
         background: rgba(137, 206, 137, 0.1);
         border-width: 15px;
      }

      .none {
         border-style: none;
      }

      .hidden {
         border-style: hidden;
      }

      .dashed {
         border-style: dashed;
         color: blue;
         border-color: red green blue pink;
      }

      .dotted {
         border-style: dotted;
         border-left-color: aqua;
      }

      .double {
         border-style: double;
         border-bottom-width: 50px;
         border-top-width: 50px;
      }

      .groove {
         border-style: groove;
      }

      .inset {
         border-style: inset;
         border-color: red;
      }

      .outset {
         border-style: outset;
      }

      .solid {
         border-style: solid;
         border-width: 10px 20px 30px 40px;
         border-color: brown rosybrown aquamarine;
      }

      .ridge {
         border-style: ridge;
      }
   </style>
</head>

<body>
   <div class="none">none</div>
   <div class="hidden">hidden</div>
   <div class="dashed">dashed</div>
   <div class="dotted">dotted</div>
   <div class="double">double</div>
   <div class="groove">groove</div>
   <div class="inset">inset</div>
   <div class="outset">outset</div>
   <div class="ridge">ridge</div>
   <div class="solid">solid</div>
</body>

</html>
