<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>카드 뒤집기</title>
   <style>
      * {
         margin: 0;
         padding: 0;
      }

      .con {
         width: 300px;
         height: 300px;
         background-color: #ccc;
         position: relative;
         margin: 400px auto;
      }

      .con .card {
         width: 100%;
         height: 100%;
         position: absolute;
         left: 0; top: 0;
         transition: .6s;
         transform-origin: top center;
         transform-style: preserve-3d;
      }

      .con:hover .card {
         transform: rotateX(180deg);
      }

      .face {
         width: 100%;
         height: 100%;
         position: absolute;
         left: 0; top: 0;   
               
      }

      .face img {
         width: 100%;
         height: 100%;
         object-fit: cover;
      }

      .front{
         z-index: 1;
         backface-visibility: hidden;
      }

   </style>
</head>

<body>
   <div class="con">
      <div class="card">
         <div class="face front"><img
               src="https://i.namu.wiki/i/LngZlr83aaFyDJ7f0vji3YbwMSdUaWL5FIXL4r62A8vTGXsKx40CdFHHKN_uES3__0I0NdWKzfGJMpewLOG3LA.webp"
               alt="먼작귀앞면"></div>
         <div class="face back"><img
               src="https://comicthumb-phinf.pstatic.net/20240214_126/pocket_1707891673014sbUxi_JPEG/005.jpg"
               alt="먼작귀뒷면"></div>
      </div><!-- //.card -->
   </div><!-- //.con -->
</body>

</html>
