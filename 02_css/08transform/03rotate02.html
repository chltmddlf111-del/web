<!DOCTYPE html>
<html lang="ko">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>rotate</title>
   <style>
      *{margin: 0; padding: 0;}
      div{
         width: 300px;
         height: 300px;
         margin: 100px;
         border: 1px solid #340b0b;
         float: left;
         background: url("https://i.namu.wiki/i/geGngQMnvmK2g3wuKU4O1uNs8Ix1HXQULk9PrnT57lHOlU4AxL9qsNCYXOOY9DIqPWtXnphq8G6NzCcvzv-ppQ.webp") no-repeat center/cover;
         perspective: 1300px;
         transition: .6s;
      }
      div p{
         height: 100%;
         background: blue;
         opacity: .3;
      
      }
      div:nth-child(1):hover {
         transform: rotateX(90deg);
      }
      div:nth-child(2):hover {
         transform: rotateY(80deg);
      }
      div:nth-child(3):hover {
         transform: rotateZ(150deg);
      }
   </style>
</head>
<body>
   <div><p></p></div>
   <div><p></p></div>
   <div><p></p></div>
</body>
</html>
