<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>float 속성</title>
   <style>
      * {
         margin: 0;
         padding: 0;
      }

      div {
         width: 100px;
         height: 100px;
         border: 1px solid #ccc;
         margin: 10px;
         background: pink;
      }

      .box1 {
         float: left;
      }

      .box2 {
         float: left;
      }

      .box3 {
         float: right;
      }

      .box4 {float: right;}

      .box5 {clear: both;
      float: right;}

      .box6 {float: right;}

      .box7 {clear: right;
      float: left;}

      .box8 {float: left;}

      .box9 {float: right}

      .box10 {float: right;}
   </style>
</head>

<body>
   <div class="box1">Box1</div>
   <div class="box2">Box2</div>
   <div class="box3">Box3</div>
   <div class="box4">Box4</div>
   <div class="box5">Box5</div>
   <div class="box6">Box6</div>
   <div class="box7">Box7</div>
   <div class="box8">Box8</div>
   <div class="box9">Box9</div>
   <div class="box10">Box10</div>
</body>

</html>
