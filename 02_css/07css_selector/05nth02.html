<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>nth-child</title>
   <style>
      :root {
         font-size: 20px;
         --font-color: #333;
         --point-color1: red;
         --point-color2: blue;
         --point-color3: green;
      }

      ul {
         list-style: none;
      }

      nav ul li {
         width: 120px;
         height: 30px;
         line-height: 30px;
         text-align: center;
         border: 1px solid var(--point-color1);
      }

      nav ul li:nth-last-child(2) {
         background: var(--point-color2);
      }

      nav ul li:nth-last-child(even) {
         /* 짝수 */
         background-color: var(--point-color3);
      }

      nav ul li:nth-last-child(odd) {
         /* 홀수 */
         background-color: var(--point-color1);
      }

      nav ul li:nth-child(2) a {
         background-color: pink;
      }

      nav ul li:first-child {
         background-color: lightblue;
      }

      nav ul li:last-child {
         background-color: lightblue;
      }

      nav ul li:nth-last-child(2) {
         background-color: lightcoral;
      }

      nav ul li:nth-child(5):hover a {
         /* nav ul 5번째 li에 마우스를 올릴 때 */
         font-size: 2rem;
         /* font-size를 2rm으로 조정한다. */
      }

      nav ul li:nth-child(3):hover {
         background-color: lightgreen;
      }
   </style>
</head>

<body>
   <nav>
      <ul>
         <li><a href="#">메뉴1</a></li>
         <li><a href="#">메뉴2</a></li>
         <li><a href="#">메뉴3</a></li>
         <li><a href="#">메뉴4</a></li>
         <li><a href="#">메뉴5</a></li>
         <li><a href="#">메뉴6</a></li>
         <li><a href="#">메뉴7</a></li>
         <li><a href="#">메뉴8</a></li>
      </ul>
   </nav>
</body>

</html>
