<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>말줄임표 두줄이상 처리</title>
   <style>
      .ellipsis_2 {
         border: 1px solid #ccc;
         width: 220px;
         overflow: hidden;
         display: -webkit-box;
         -webkit-line-clamp: 3;
         -webkit-box-orient: vertical;
         /* 최신 표준 문법도 함께 작성
         브라우저에 따라 안나올 수도 있으니 line-clamp도 같이 써줘야함. */
         line-clamp:  3;
      }
            .ellipsis_2:hover{
         overflow: visible;
         white-space: unset;
            }
   </style>
</head>

<body>
   <p class="ellipsis_2">
      This is some text! This is some text! This is some text!
      This is some text! This is some text! This is some text!
   </p>
</body>

</html>
