<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>text_shadow</title>
   <style>
      .ex{
         margin-top: 100px;
         border: 1px solid #ccc;
      }
      h2{
         margin-left: 10px;
         text-align: center;
         line-height: 20px;
      }
      .s1{
         color: #f00;
         font-size: 50px;
         text-shadow: 10px 10px 3px rgb(0, 0, 0);
      }
      .s2{
         color: orange;
         text-shadow: -2px -2px 4px blue;
      }
      .s3{
         color: rgb(191, 11, 11);
         text-shadow: 10px 5px 5px #e57c7c;
         text-decoration: underline double #c91815b5 2px;
      }
      .s4{
         color: aquamarine;
         text-shadow: 3px 3px 2px rgb(10, 119, 83);
         text-decoration: line-through double aquamarine;
      }
      .s5{
         color: #f00;
         text-decoration: underline wavy #f00 2px;
         text-shadow: -4px -3px 4px rosybrown;
      }
   </style>
</head>

<body>
   <h1>text-shadow 속성</h1>
   <p>텍스트에 그림자 효과를 추가하는 속성</p>
   <p>text-shadow : 가로거리 세로거리 번짐정도 색상</p>
   <div class="ex">
      <h2 class="s1">HTML5</h2>
      <h2 class="s2">HTML5</h2>
      <h2 class="s3">HTML5</h2>
      <h2 class="s4">HTML5</h2>
      <h2 class="s5">HTML5</h2>
   </div>
</body>

</html>
