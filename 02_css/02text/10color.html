<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>color 속성</title>
   <style>
      body{background: lightcoral;}

      .hax{
         color: #216;
      }
      .rgb{
         color: rgba(125 100 110 0.89)
      }
      .hsl{
         color: hsl(292, 30, 81, 100%);
      }
      .col{
         color: aquamarine;
      }
      div{
         width: 100px;
         height: 50px;
         background: rgba(125, 100, 50,.5) ;
         /*  */
      }
   </style>
</head>

<body>
   <h1>color 속성</h1>
   <ul>
      <li>글자색 지정</li>
      <li>
         <span class="hax">16진수 값(HAX 코드), </span>
         <span class="rgb">RGB 값 , </span>
         <span class="hsl">HSL 값 , </span>
         <span class="col">색상 이름</span>
      </li>
   </ul>
   <div>rgba</div>
</body>

</html>
