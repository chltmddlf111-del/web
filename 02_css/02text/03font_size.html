<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>폰트 사이즈</title>
   <style>
      * {
         padding: 0;
         margin: 0;
      }

      :root{font-size: 100px;}

      .px40 {
         font-size: 40px;
      }

      .em4 {
         font-size: 4em;
      }
         
      .rem4 {font-size: 4rem;}
      /* em : 바로 위의 요소가 부모가 되어 부모요소*n이 되어버림.
         rem : 최상위(html=root)의 크기를 기준으로 *n
         따라서 4em = 40px*4  , 4rem = 100px*4 가 되어버림. */
   </style>

</head>

<body>
   <div class="px40">
      <p>기본 사이즈</p>
      <p class="em4">4em</p>
      <p class="rem4">4rem</p>
   </div>
</body>

</html>
